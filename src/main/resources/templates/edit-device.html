<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edit device | Haven</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div class="app-shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">⌂</span><div><strong>Haven</strong><small>SMART HOME</small></div></div><div class="nav-label">WORKSPACE</div><a class="nav-item" th:href="@{/}">▦ <span>Overview</span></a><a class="nav-item active" th:href="@{/devices}">⌁ <span>Devices</span></a><a class="nav-item" th:href="@{/rooms}">▤ <span>Rooms</span></a><div class="sidebar-bottom"><div class="profile-dot" sec:authentication="name" th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">U</div><div style="flex: 1; min-width: 0;"><strong sec:authentication="name" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">User</strong><small>Authenticated</small></div><form th:action="@{/logout}" method="post" class="logout-form"><button type="submit" class="logout-btn" title="Sign out">Log out</button></form></div></aside>
<main class="main"><header class="topbar"><div><div class="eyebrow">DEVICE SETTINGS</div><h1>Edit device</h1></div><a class="button button-outline" th:href="@{/devices}">← Back to devices</a></header>
<section class="form-panel edit-panel"><div class="panel-heading"><div><div class="eyebrow">UPDATE DETAILS</div><h2 th:text="'Edit ' + ${device.name}">Edit device</h2><p class="muted">Update the saved device information.</p></div></div>
<form th:action="@{/devices/{id}/edit(id=${device.id})}" th:object="${device}" method="post" class="form-grid">
<label>Device name<input type="text" th:field="*{name}" required maxlength="100"><small class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small></label>
<label>Device type<select th:field="*{deviceType}" required><option th:each="t : ${deviceTypes}" th:value="${t}" th:text="${t}"></option></select><small class="field-error" th:if="${#fields.hasErrors('deviceType')}" th:errors="*{deviceType}"></small></label>
<label>Room<select th:field="*{room.id}" required><option th:each="r : ${rooms}" th:value="${r.id}" th:text="${r.name}"></option></select><small class="field-error" th:if="${#fields.hasErrors('room')}" th:errors="*{room}"></small></label>
<label>Rated power (W)<input type="number" th:field="*{ratedPowerW}" min="0.1" step="0.1" placeholder="e.g. 12 (optional)"><small class="field-error" th:if="${#fields.hasErrors('ratedPowerW')}" th:errors="*{ratedPowerW}"></small><small class="hint">Device rated wattage in watts. If unknown, leave blank.</small></label>
<label>Communication status<select th:field="*{communicationStatus}"><option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option></select></label>
<div class="form-footer"><span class="hint">Device state is controlled from the Devices page.</span><button class="button button-primary" type="submit">Save changes <span>→</span></button></div>
</form></section><footer>HAVEN SMART HOME <span>•</span> Student project demonstration</footer></main></div></body></html>
